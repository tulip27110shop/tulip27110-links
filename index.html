<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tủ Đồ Tulip</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFF6F0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1315">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">

<style>
  :root{
    color-scheme: light;
    --bg: #FFF6F0;
    --surface: #FFFFFF;
    --surface-2: #FFFDFB;
    --ink: #2A1F1B;
    --ink-muted: #8C7A72;
    --rose: #E24E71;
    --rose-strong: #C93A5C;
    --rose-soft: #FBE4E8;
    --gold: #C98A2E;
    --gold-soft: #F6E8D1;
    --plum: #7A5CC9;
    --plum-soft: #EDE7F8;
    --teal: #2E9A8C;
    --teal-soft: #E2F1EE;
    --line: #F0E2DB;
    --shadow: rgba(60, 30, 25, 0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #1A1315;
      --surface: #241A1D;
      --surface-2: #2B1F22;
      --ink: #F6EDE9;
      --ink-muted: #B8A099;
      --rose: #FF85A1;
      --rose-strong: #FFA3B7;
      --rose-soft: #3B2227;
      --gold: #E8B35C;
      --gold-soft: #3C2F1C;
      --plum: #C9B4F0;
      --plum-soft: #2E2440;
      --teal: #7FD0C3;
      --teal-soft: #1E302C;
      --line: #3A2A2D;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #1A1315;
    --surface: #241A1D;
    --surface-2: #2B1F22;
    --ink: #F6EDE9;
    --ink-muted: #B8A099;
    --rose: #FF85A1;
    --rose-strong: #FFA3B7;
    --rose-soft: #3B2227;
    --gold: #E8B35C;
    --gold-soft: #3C2F1C;
    --plum: #C9B4F0;
    --plum-soft: #2E2440;
    --teal: #7FD0C3;
    --teal-soft: #1E302C;
    --line: #3A2A2D;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  *{ box-sizing: border-box; }
  html{ height: 100%; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "DM Sans", system-ui, sans-serif;
    margin: 0;
    padding: 14px 16px 10px;
    display: flex;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  /* Bố cục một màn hình: tiêu đề + ô tìm + lọc cố định, danh sách cuộn bên trong */
  .page{
    width: 100%;
    max-width: 1080px;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---------- header: logo + tên xếp ngang, gọn ---------- */
  .head{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .brand-mark{
    width: 38px; height: 38px;
    border-radius: 12px;
    background: linear-gradient(155deg, var(--rose) 0%, #F28FA3 100%);
    display: flex; align-items: center; justify-content: center;
    margin: 0;
    flex-shrink: 0;
    box-shadow: 0 8px 20px -8px var(--shadow);
  }
  .brand-mark svg{ width: 20px; height: 20px; display:block; }
  .head-text{ min-width: 0; }

  .handle{
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--rose-strong);
    margin: 0 0 2px;
  }
  h1{
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 21px;
    line-height: 1.15;
    margin: 0;
  }
  .sub{
    text-align: center;
    color: var(--ink-muted);
    font-size: 12.5px;
    line-height: 1.45;
    margin: 0 0 10px;
    flex-shrink: 0;
  }

  /* ---------- controls: ô tìm + hàng lọc nằm ngang cùng dòng ---------- */
  .controls{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .search-wrap{
    position: relative;
    display: flex;
    align-items: center;
    flex: 0 1 280px;
  }
  .search-wrap svg{
    position: absolute;
    left: 14px;
    width: 16px; height: 16px;
    color: var(--ink-muted);
    pointer-events: none;
  }
  #search{
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 12px 14px 12px 38px;
    outline: none;
  }
  #search::placeholder{ color: var(--ink-muted); }
  #search:focus{ border-color: var(--rose); }

  .tabs{
    display: flex;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    flex: 1;
    min-width: 0;
  }
  .tabs::-webkit-scrollbar{ display: none; }
  .tab{
    flex: 0 0 auto;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 9px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab[aria-selected="true"]{
    background: var(--rose);
    color: #fff;
  }

  /* ---------- cards: lưới nhiều cột, cuộn bên trong khung ---------- */
  #list{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
    gap: 10px;
    align-content: start;
    padding: 2px 4px 10px 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--rose-soft) transparent;
  }
  #list::-webkit-scrollbar{ width: 8px; }
  #list::-webkit-scrollbar-thumb{ background: var(--rose-soft); border-radius: 99px; }
  #list::-webkit-scrollbar-track{ background: transparent; }
  .card{
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px 12px 10px 10px;
    text-decoration: none;
    color: var(--ink);
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background-color .25s ease, color .25s ease;
  }
  .card:active{ transform: scale(0.98); }
  @media (hover: hover){
    .card:hover{
      border-color: var(--rose);
      box-shadow: 0 10px 24px -14px var(--shadow);
    }
  }

  .thumb{
    flex-shrink: 0;
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .thumb svg{ width: 20px; height: 20px; position: relative; z-index: 1; }
  .thumb .mono{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 3px 4px;
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
  }

  .card-body{ min-width: 0; flex: 1; display: flex; flex-direction: column; }

  .card-top{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .tag{
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--rose-strong);
    background: var(--rose-soft);
    border-radius: 999px;
    padding: 3px 8px;
    text-wrap: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tag.men{ color: var(--gold); background: var(--gold-soft); }
  .tag.gift{ color: var(--rose-strong); background: var(--gold-soft); }
  .tag.beauty{ color: var(--plum); background: var(--plum-soft); }
  .tag.acc{ color: var(--teal); background: var(--teal-soft); }

  .price{
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .brand-name{
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 15.5px;
    line-height: 1.3;
    margin: 0 0 3px;
  }
  .note{
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--ink-muted);
    margin: 0 0 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .go{
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--rose);
    margin-top: auto;
  }
  .go svg{ width: 14px; height: 14px; transition: transform .12s ease; }
  .card:hover .go svg{ transform: translateX(2px); }

  .empty{
    text-align: center;
    color: var(--ink-muted);
    font-size: 13.5px;
    padding: 30px 20px;
  }

  /* ---------- họa tiết nền: thỏ, nơ, tim ---------- */
  :root{
    --pattern: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220' fill='none' stroke='%23E24E71' stroke-opacity='0.13' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(42 48) rotate(-10)'><path d='M-8 -4C-11 -14 -9 -21 -6 -21C-3 -21 -2 -12 -2 -6'/><path d='M8 -4C11 -14 9 -21 6 -21C3 -21 2 -12 2 -6'/><circle cx='0' cy='4' r='11'/><circle cx='-4' cy='2' r='1' fill='%23E24E71' stroke='none'/><circle cx='4' cy='2' r='1' fill='%23E24E71' stroke='none'/><path d='M-2 8h4M0 8c0 2 -2 3 -3.4 2.2M0 8c0 2 2 3 3.4 2.2'/></g><g transform='translate(148 122) rotate(12)'><path d='M0 0C-6 -8 -16 -8 -16 -2C-16 4 -6 4 0 0Z'/><path d='M0 0C6 -8 16 -8 16 -2C16 4 6 4 0 0Z'/><circle cx='0' cy='0' r='3.2'/><path d='M-2 3L-5 12M2 3L5 12'/></g><path d='M58 160c-1.5-2.5-5-2.5-5 .3 0 2.7 3.5 4.2 5 5.7 1.5-1.5 5-3 5-5.7 0-2.8-3.5-2.8-5-.3Z'/><path d='M186 36v10M181 41h10'/><path d='M22 118v8M18 122h8'/><circle cx='112' cy='28' r='1.5' fill='%23E24E71' stroke='none'/><circle cx='196' cy='176' r='1.5' fill='%23E24E71' stroke='none'/><circle cx='16' cy='196' r='1.5' fill='%23E24E71' stroke='none'/></svg>");
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --pattern: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220' fill='none' stroke='%23FF85A1' stroke-opacity='0.15' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(42 48) rotate(-10)'><path d='M-8 -4C-11 -14 -9 -21 -6 -21C-3 -21 -2 -12 -2 -6'/><path d='M8 -4C11 -14 9 -21 6 -21C3 -21 2 -12 2 -6'/><circle cx='0' cy='4' r='11'/><circle cx='-4' cy='2' r='1' fill='%23FF85A1' stroke='none'/><circle cx='4' cy='2' r='1' fill='%23FF85A1' stroke='none'/><path d='M-2 8h4M0 8c0 2 -2 3 -3.4 2.2M0 8c0 2 2 3 3.4 2.2'/></g><g transform='translate(148 122) rotate(12)'><path d='M0 0C-6 -8 -16 -8 -16 -2C-16 4 -6 4 0 0Z'/><path d='M0 0C6 -8 16 -8 16 -2C16 4 6 4 0 0Z'/><circle cx='0' cy='0' r='3.2'/><path d='M-2 3L-5 12M2 3L5 12'/></g><path d='M58 160c-1.5-2.5-5-2.5-5 .3 0 2.7 3.5 4.2 5 5.7 1.5-1.5 5-3 5-5.7 0-2.8-3.5-2.8-5-.3Z'/><path d='M186 36v10M181 41h10'/><path d='M22 118v8M18 122h8'/><circle cx='112' cy='28' r='1.5' fill='%23FF85A1' stroke='none'/><circle cx='196' cy='176' r='1.5' fill='%23FF85A1' stroke='none'/><circle cx='16' cy='196' r='1.5' fill='%23FF85A1' stroke='none'/></svg>");
    }
  }
  :root[data-theme="dark"]{
    --pattern: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' viewBox='0 0 220 220' fill='none' stroke='%23FF85A1' stroke-opacity='0.15' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(42 48) rotate(-10)'><path d='M-8 -4C-11 -14 -9 -21 -6 -21C-3 -21 -2 -12 -2 -6'/><path d='M8 -4C11 -14 9 -21 6 -21C3 -21 2 -12 2 -6'/><circle cx='0' cy='4' r='11'/><circle cx='-4' cy='2' r='1' fill='%23FF85A1' stroke='none'/><circle cx='4' cy='2' r='1' fill='%23FF85A1' stroke='none'/><path d='M-2 8h4M0 8c0 2 -2 3 -3.4 2.2M0 8c0 2 2 3 3.4 2.2'/></g><g transform='translate(148 122) rotate(12)'><path d='M0 0C-6 -8 -16 -8 -16 -2C-16 4 -6 4 0 0Z'/><path d='M0 0C6 -8 16 -8 16 -2C16 4 6 4 0 0Z'/><circle cx='0' cy='0' r='3.2'/><path d='M-2 3L-5 12M2 3L5 12'/></g><path d='M58 160c-1.5-2.5-5-2.5-5 .3 0 2.7 3.5 4.2 5 5.7 1.5-1.5 5-3 5-5.7 0-2.8-3.5-2.8-5-.3Z'/><path d='M186 36v10M181 41h10'/><path d='M22 118v8M18 122h8'/><circle cx='112' cy='28' r='1.5' fill='%23FF85A1' stroke='none'/><circle cx='196' cy='176' r='1.5' fill='%23FF85A1' stroke='none'/><circle cx='16' cy='196' r='1.5' fill='%23FF85A1' stroke='none'/></svg>");
  }
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image: var(--pattern);
    background-size: 220px 220px;
    pointer-events: none;
    z-index: -1;
  }

  /* nơ hai bên tiêu đề */
  h1{ display: flex; align-items: center; gap: 8px; }
  .deco-bow{ flex-shrink: 0; display: inline-flex; color: var(--rose); opacity: .55; }
  .deco-bow svg{ width: 17px; height: 12px; }
  .deco-bow.flip svg{ transform: scaleX(-1); }

  /* nút đổi giao diện sáng / tối */
  #theme-toggle{
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    right: calc(14px + env(safe-area-inset-right));
    width: 38px; height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-muted);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px -6px var(--shadow);
    z-index: 10;
    transition: color .2s ease, border-color .2s ease, background-color .25s ease;
  }
  #theme-toggle svg{ width: 18px; height: 18px; }
  #theme-toggle:hover{ color: var(--rose); border-color: var(--rose); }

  body, #search, .tabs, .tab{
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }

  footer{
    text-align: center;
    color: var(--ink-muted);
    font-size: 11.5px;
    line-height: 1.5;
    margin: 8px 0 0;
    flex-shrink: 0;
  }
  footer strong{ color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- mobile: lưới 2 cột, mọi thứ thu nhỏ ---------- */
  @media (max-width: 640px){
    body{ padding: 10px 12px 6px; }
    .head{ gap: 10px; margin-bottom: 6px; }
    .brand-mark{ width: 34px; height: 34px; border-radius: 11px; }
    .brand-mark svg{ width: 18px; height: 18px; }
    h1{ font-size: 18px; }
    .handle{ font-size: 10.5px; }
    .sub{
      font-size: 12px;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls{ flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .search-wrap{ flex: 1 1 auto; width: 100%; }
    .tabs{ width: 100%; }
    .tab{ padding: 8px 11px; }
    #list{ grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 8px; padding-right: 2px; }
    .card{ padding: 9px 10px; border-radius: 14px; gap: 8px; }
    .card:active{ transform: scale(0.97); }
    .thumb{ width: 38px; height: 38px; border-radius: 10px; }
    .thumb svg{ width: 17px; height: 17px; }
    .thumb .mono{ font-size: 10px; padding: 2px 3px; }
    .tag{ font-size: 9.5px; padding: 2px 7px; }
    .price{ font-size: 10.5px; white-space: normal; text-align: right; max-width: 42%; }
    .brand-name{ font-size: 13.5px; }
    .note{ font-size: 11.5px; }
    .go{ font-size: 11px; }
    footer{ font-size: 11px; margin-top: 6px; }
  }
</style>

</head>
<body>

<button id="theme-toggle" aria-label="Chuyển sang chế độ tối"></button>

<div class="page">

  <header class="head">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-5-4.2-5-9a5 5 0 0 1 10 0c0 4.8-5 9-5 9Z"/>
        <path d="M12 12V3"/>
        <path d="M9 6c0-1.5 1.5-3 3-3s3 1.5 3 3"/>
      </svg>
    </div>
    <div class="head-text">
      <p class="handle">@tulip27110</p>
      <h1><span class="deco-bow" aria-hidden="true"><svg viewBox="0 0 36 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13C12 4 2 4 2 10c0 6 10 7 16 3Z"/><path d="M18 13c6-9 16-9 16-3 0 6-10 7-16 3Z"/><circle cx="18" cy="13" r="3"/><path d="M16 16l-3 8m8-8 3 8"/></svg></span>Tủ đồ xinh của Tulip<span class="deco-bow flip" aria-hidden="true"><svg viewBox="0 0 36 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13C12 4 2 4 2 10c0 6 10 7 16 3Z"/><path d="M18 13c6-9 16-9 16-3 0 6-10 7-16 3Z"/><circle cx="18" cy="13" r="3"/><path d="M16 16l-3 8m8-8 3 8"/></svg></span></h1>
    </div>
  </header>
  <p class="sub">Tổng hợp shop đã mặc &amp; review trên kênh — bấm vào thẻ để mở thẳng shop trên Shopee.</p>

  <div class="controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Tìm theo phong cách, brand..." autocomplete="off">
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>Không tìm thấy gì khớp. Thử từ khoá khác nhé.</p>

  <footer><strong id="count">0</strong> lựa chọn · <span id="sync-status">đang tải bản mới nhất…</span> · TikTok @tulip27110</footer>
</div>

<!-- Dữ liệu sẵn (bản chụp từ Google Sheet, GitHub Actions tự làm mới mỗi vài giờ).
     Trang vẫn tải trực tiếp Google Sheet mỗi lần mở — bản này chỉ dùng khi mạng tới Google lỗi. -->
<script src="data.js"></script>

<script>
  // ============ DỮ LIỆU ============
  // data.js (tự sinh bởi sync.mjs) chứa: danh sách tab của Google Sheet + bản chụp dữ liệu.
  // Mỗi lần mở trang vẫn fetch trực tiếp từng tab từ Google Sheet => thêm dòng / sửa link
  // trong sheet là trang này tự mới theo, không cần đẩy lại GitHub. Tab mới thêm vào sheet
  // do GitHub Actions đồng bộ về data.js trong vòng vài giờ.
  const DATA = window.TULIP_DATA || { sheetId: "1W41kcOQO3v_1oZIZ_pe3urvyKqJb5Vx2sQNUh2jxGP4", tabs: [], shops: [] };
  const SHEET_ID = DATA.sheetId;

  let SHOPS = DATA.shops.map(s => ({
    style: s.style || "", brand: s.brand || "Shop", cat: s.cat || "Đồ nữ",
    note: s.note || "", price: s.price || "", link: s.link
  }));

  // ============ TIỆN ÍCH ============
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function cleanCell(v){
    return String(v == null ? "" : v).replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim();
  }

  const fold = (s) => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").toLowerCase().trim();

  // Parser CSV chuẩn RFC4180 — xử lý ô có dấu ngoặc kép, phẩy và xuống dòng bên trong
  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i + 1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ","){ row.push(field); field = ""; }
      else if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c !== "\r") field += c;
    }
    if (field !== "" || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  // Tìm cột theo tên tiêu đề (so cả có dấu lẫn không dấu), trả về -1 nếu không có
  function colBy(header, needles){
    const h = header.map(fold);
    for (const n of needles){
      const i = h.indexOf(n);
      if (i !== -1) return i;
    }
    for (const n of needles){
      const i = h.findIndex(x => x.includes(n));
      if (i !== -1) return i;
    }
    return -1;
  }

  // Nhóm danh mục cố định theo tên tab; tab "Tổng hợp" để danh mục theo cột Phân loại.
  // Tab lạ sau này (vd "Đồ ăn") lấy chính tên tab làm danh mục -> nút lọc tự xuất hiện.
  function tabCat(name){
    const n = fold(name);
    if (n.includes("tong hop")) return null;
    if (n.includes("my pham")) return "Mỹ phẩm";
    if (n.includes("phu kien")) return "Phụ kiện";
    if (n.includes("qua tang") || n.includes("qua ny")) return "Quà tặng";
    return name.trim();
  }

  // ============ ĐỌC SHEET ============
  // Parser chung cho mọi tab: nhận diện cột theo tên tiêu đề (Link, BRAND/Sản phẩm,
  // Phong cách, Phân loại, Ghi chú/Lý do, Phân khúc giá) bất kể thứ tự cột.
  function parseTab(rows, tabName){
    if (!rows.length) return [];
    const H = rows[0];
    const iLink = colBy(H, ["link"]);
    if (iLink === -1) return [];
    const iBrand = colBy(H, ["san pham nhac", "ten san pham", "san pham", "brand", "ten"]);
    const iStyle = colBy(H, ["phong cach"]);
    const iCat = colBy(H, ["phan loai"]);
    const iNote = colBy(H, ["ghi chu", "ly do"]);
    const iPrice = colBy(H, ["phan khuc gia", "gia"]);
    const fixedCat = tabCat(tabName);
    const out = [];
    for (const r of rows.slice(1)){
      const link = cleanCell(r[iLink] || "");
      if (!/^https?:\/\//i.test(link)) continue;
      const rowCat = iCat !== -1 ? cleanCell(r[iCat] || "") : "";
      // Ưu tiên cột Phong cách; tab có danh mục cố định (Mỹ phẩm...) thì dùng giá trị
      // cột Phân loại làm tag (vd "Son", "Kem nền"); còn lại thì lấy tên tab.
      const style = (iStyle !== -1 ? cleanCell(r[iStyle] || "")
        : fixedCat && iCat !== -1 ? rowCat : "") || tabName;
      out.push({
        style,
        brand: (iBrand !== -1 ? cleanCell(r[iBrand] || "") : "") || "Shop",
        cat: fixedCat || rowCat || "Đồ nữ",
        note: iNote !== -1 ? cleanCell(r[iNote] || "") : "",
        price: iPrice !== -1 ? cleanCell(r[iPrice] || "") : "",
        link
      });
    }
    return out;
  }

  function fetchTab(gid){
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=out:csv&gid=" + gid + "&t=" + Date.now();
    return fetch(url, { cache: "no-store" }).then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(text => {
      if (/setResponse\(/.test(text.slice(0, 200))) throw new Error("sheet error");
      return parseCSV(text);
    });
  }

  function mergeShops(lists){
    const seen = new Set(), out = [];
    for (const s of lists.flat()){
      if (seen.has(s.link)) continue;
      seen.add(s.link);
      out.push(s);
    }
    return out;
  }

  async function loadSheet(){
    const status = document.getElementById("sync-status");
    try{
      const tabs = (DATA.tabs || []).filter(t => t.gid != null);
      const lists = await Promise.all(
        tabs.map(t => fetchTab(t.gid).then(rows => parseTab(rows, t.name)).catch(() => []))
      );
      const merged = mergeShops(lists);
      if (merged.length){
        SHOPS = merged;
        buildTabs();
        render();
      }
      status.textContent = "tự động cập nhật lúc " +
        new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
      status.textContent = "không tải được bản mới — đang xem bản lưu sẵn";
    }
  }

  // ============ GIAO DIỆN ============
  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const searchEl = document.getElementById("search");
  const tabsEl = document.getElementById("tabs");

  let activeFilter = "all";

  // Dựng nút lọc theo đúng các nhóm có trong dữ liệu — nhóm mới thêm vào sheet tự xuất hiện.
  // Nhóm ghi ghép kiểu "Đồ nam, Đồ nữ" được tách thành các nút lọc riêng lẻ.
  function buildTabs(){
    const cats = [];
    for (const s of SHOPS){
      for (const part of s.cat.split(",")){
        const c = part.trim();
        if (c && !cats.includes(c)) cats.push(c);
      }
    }
    const order = ["Đồ nữ", "Đồ nam", "Mỹ phẩm", "Phụ kiện", "Đồ ăn", "Quà tặng"];
    cats.sort((a, b) => {
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    if (activeFilter !== "all" && !cats.includes(activeFilter)) activeFilter = "all";
    tabsEl.innerHTML =
      `<button class="tab" role="tab" aria-selected="${activeFilter === "all"}" data-filter="all">Tất cả</button>` +
      cats.map(c => `<button class="tab" role="tab" aria-selected="${activeFilter === c}" data-filter="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");
  }

  // Thumbnail = gradient theo tên brand + icon loại + chữ cái đầu, thay cho ảnh thật
  // (Shopee không cho lấy ảnh tự động, dùng monogram cho tới khi có ảnh thật)
  const GRADIENTS = [
    ["#F2A6B8", "#E24E71"],
    ["#F6C98A", "#C98A2E"],
    ["#B9A0E0", "#7A5CC9"],
    ["#8FD0C9", "#2E9A8C"],
    ["#F2A6B8", "#C93A5C"],
    ["#A7C6E8", "#4472B8"],
  ];
  const ICONS = {
    women: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-5-4.2-5-9a5 5 0 0 1 10 0c0 4.8-5 9-5 9Z"/><path d="M12 12V3"/><path d="M9 6c0-1.5 1.5-3 3-3s3 1.5 3 3"/></svg>',
    men: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3 3 2 3-2 3 3-2 2v12a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1V8L6 6Z"/></svg>',
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M4 9h16M12 9v11M12 9c-1.6 0-4-1-4-3.2A2.3 2.3 0 0 1 10.3 3C12 3 12 6 12 9Zm0 0c1.6 0 4-1 4-3.2A2.3 2.3 0 0 0 13.7 3C12 3 12 6 12 9Z"/></svg>',
    beauty: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 11V4.8c0-.5.6-.9 1-.6l3.4 2.3c.3.2.4.5.4.8V11"/><rect x="8" y="11" width="8" height="4" rx="0.5"/><path d="M8.5 15h7v6h-7z"/></svg>',
    acc: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l4 6-9 12L3 9Z"/><path d="M3 9h18"/><path d="M9.5 3 12 9l2.5-6"/><path d="M12 21 8.5 9"/><path d="m12 21 3.5-12"/></svg>',
  };

  function hashStr(str){
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }

  function catList(s){
    return s.cat.split(",").map(t => t.trim());
  }

  function iconFor(s){
    const c = catList(s);
    if (c.includes("Quà tặng")) return ICONS.gift;
    if (c.includes("Phụ kiện")) return ICONS.acc;
    if (c.includes("Mỹ phẩm")) return ICONS.beauty;
    if (c.includes("Đồ nam") && !c.includes("Đồ nữ")) return ICONS.men;
    return ICONS.women;
  }

  function thumbHtml(s){
    const [c1, c2] = GRADIENTS[hashStr(s.brand) % GRADIENTS.length];
    const initial = s.brand.trim().charAt(0).toUpperCase();
    return `<div class="thumb" style="background:linear-gradient(155deg, ${c1}, ${c2})">
      ${iconFor(s)}
      <span class="mono">${escapeHtml(initial)}</span>
    </div>`;
  }

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    const items = SHOPS.filter(s => {
      if (activeFilter !== "all" && !catList(s).includes(activeFilter)) return false;
      if (!q) return true;
      return (s.style + " " + s.brand + " " + s.note).toLowerCase().includes(q);
    });

    countEl.textContent = items.length;
    emptyEl.hidden = items.length !== 0;

    listEl.innerHTML = items.map(s => {
      const c = catList(s);
      const tagClass = c.includes("Quà tặng") ? "gift" : c.includes("Phụ kiện") ? "acc" : c.includes("Mỹ phẩm") ? "beauty" : c.includes("Đồ nam") && !c.includes("Đồ nữ") ? "men" : "";
      return `
      <a class="card" href="${escapeHtml(s.link)}" target="_blank" rel="nofollow noopener">
        ${thumbHtml(s)}
        <div class="card-body">
          <div class="card-top">
            <span class="tag${tagClass ? " " + tagClass : ""}">${escapeHtml(s.style)}</span>
            ${s.price ? `<span class="price">${escapeHtml(s.price)}</span>` : ""}
          </div>
          <p class="brand-name">${escapeHtml(s.brand)}</p>
          ${s.note ? `<p class="note">${escapeHtml(s.note)}</p>` : ""}
          <span class="go">Mở shop
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
          </span>
        </div>
      </a>
    `;
    }).join("");
  }

  searchEl.addEventListener("input", render);
  tabsEl.addEventListener("click", e => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    tabsEl.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", "false"));
    btn.setAttribute("aria-selected", "true");
    activeFilter = btn.dataset.filter;
    render();
  });

  buildTabs();
  render();      // hiện bản lưu sẵn ngay lập tức
  loadSheet();   // rồi tải bản mới nhất từ Google Sheet

  // ============ CHẾ ĐỘ SÁNG / TỐI ============
  const themeBtn = document.getElementById("theme-toggle");
  const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  let userTheme = null;
  try { userTheme = localStorage.getItem("tulip-theme"); } catch (e) {}
  if (userTheme !== "light" && userTheme !== "dark"){
    userTheme = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    themeBtn.innerHTML = t === "dark" ? ICON_SUN : ICON_MOON;
    themeBtn.setAttribute("aria-label", t === "dark" ? "Chuyển sang chế độ sáng" : "Chuyển sang chế độ tối");
  }
  applyTheme(userTheme);
  themeBtn.addEventListener("click", () => {
    userTheme = userTheme === "dark" ? "light" : "dark";
    try { localStorage.setItem("tulip-theme", userTheme); } catch (e) {}
    applyTheme(userTheme);
  });
</script>
</body>
</html>
